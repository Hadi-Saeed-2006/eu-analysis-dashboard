name: Build EU Analysis Data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Rebuild processed datasets
        run: python scripts/rebuild_project.py

      - name: Commit processed datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/
          if git diff --cached --quiet; then
            echo 'No dataset changes to commit.'
          else
            git commit -m 'Build processed EU analysis datasets'
            git push
          fi
